<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG 智能检索助手（支持 MD 渲染）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --primary-color: #4285f4;
      --primary-light: #e8f0fe;
      --assistant-bg: #f0f4f8;
      --user-bg: #4285f4;
      --text-primary: #333333;
      --text-secondary: #666666;
      --border-color: #e0e0e0;
      --shadow: 0 2px 10px rgba(0,0,0,0.08);
      --transition: all 0.3s ease;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9fafb;
      color: var(--text-primary);
      line-height:1.6;
    }
    .header {
      background-color: white;
      box-shadow: var(--shadow);
      padding:1rem 0;
      position: sticky;
      top:0;
      z-index:100;
    }
    .header-title {
      display:flex;
      align-items:center;
      gap:0.75rem;
      color: var(--primary-color);
      font-size:1.5rem;
      font-weight:600;
    }
    .chat-container {
      max-width:900px;
      margin:0 auto;
      padding:1.5rem;
      height: calc(100vh - 240px);
      overflow-y:auto;
    }
    .empty-state {
      color: var(--text-secondary);
      padding:3rem 0;
      opacity:0.8;
      text-align:center;
    }
    .message {
      display:flex;
      margin-bottom:1.5rem;
      animation: fadeIn 0.3s ease;
      max-width:85%;
    }
    .user-message {
      margin-left:auto;
      flex-direction: row-reverse;
    }
    .message-avatar {
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }
    .user-avatar {
      background-color: var(--user-bg);
      color: white;
    }
    .assistant-avatar {
      background-color: var(--primary-light);
      color: var(--primary-color);
    }
    .message-content {
      padding:0.8rem 1.2rem;
      border-radius:18px;
      margin:0 0.75rem;
    }
    .user-content {
      background-color: var(--user-bg);
      color: white;
      border-top-right-radius:4px;
    }
    .assistant-content {
      background-color: var(--assistant-bg);
      border-top-left-radius:4px;
    }
    .input-container {
      max-width:900px;
      margin:0 auto;
      padding:1rem 1.5rem 1.5rem;
      position: sticky;
      bottom:0;
      background-color:#f9fafb;
      border-top:1px solid var(--border-color);
    }
    .input-card {
      background-color:white;
      border-radius:12px;
      padding:1rem;
      box-shadow: var(--shadow);
    }
    .form-row {
      display:flex;
      gap:0.75rem;
    }
    .query-input {
      flex:1;
      border:1px solid var(--border-color);
      border-radius:24px;
      padding:0.8rem 1.2rem;
      resize:none;
      font-size:1rem;
      transition: var(--transition);
      height:56px;
    }
    .query-input:focus {
      outline:none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(66,133,244,0.2);
    }
    .submit-btn {
      width:56px;
      height:56px;
      border-radius:50%;
      background-color: var(--primary-color);
      color: white;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition: var(--transition);
    }
    .submit-btn:hover {
      background-color:#3367d6;
      transform:scale(1.05);
    }
    .submit-btn:disabled {
      background-color:#a0c4ff;
      cursor:not-allowed;
      transform:none;
    }
    .controls {
      display:flex;
      justify-content:space-between;
      margin-top:1rem;
      font-size:0.9rem;
      color: var(--text-secondary);
    }
    select {
      border:1px solid var(--border-color);
      border-radius:4px;
      padding:0.3rem 0.5rem;
      margin-left:0.5rem;
      background-color:white;
    }
    .loading-dots {
      display:flex;
      gap:6px;
      padding:0.5rem 0;
    }
    .loading-dot {
      width:10px;
      height:10px;
      border-radius:50%;
      background-color: var(--primary-color);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dot:nth-child(1){ animation-delay: -0.32s;}
    .loading-dot:nth-child(2){ animation-delay: -0.16s;}
    /* 修正标题层级样式 */
    .assistant-content h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    .assistant-content h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 0.8rem;
      margin-bottom: 0.4rem;
    }
    .assistant-content h3 {
      font-size: 1.05rem;
      font-weight: 500;
      margin-top: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .assistant-content h4,
    .assistant-content h5,
    .assistant-content h6 {
      font-size: 1rem;
      font-weight: 500;
      margin-top: 0.5rem;
      margin-bottom: 0.2rem;
    }
    .assistant-content ul, .assistant-content ol {
      padding-left:1.5rem;
      margin:0.4rem 0;
    }
    .assistant-content code {
      background-color:#e9ecef;
      padding:0.2rem 0.4rem;
      border-radius:4px;
      font-family:monospace;
      font-size:0.9rem;
    }
    .assistant-content pre {
      background-color:#2d2d2d;
      color:#f8f8f2;
      padding:0.8rem;
      border-radius:8px;
      overflow-x:auto;
      margin:0.6rem 0;
    }
    .assistant-content blockquote {
      border-left:3px solid var(--primary-color);
      padding-left:0.8rem;
      margin:0.6rem 0;
      color: var(--text-secondary);
    }
    .assistant-content a {
      color: var(--primary-color);
      text-decoration: underline;
    }
    .source-tag {
      display:inline-block;
      font-size:0.8rem;
      color:#888;
      margin:0.3rem 0 0.8rem 0;
      padding-left:0.2rem;
    }
    .error-message {
      color:#d93025;
    }
    @keyframes fadeIn {
      from{opacity:0; transform:translateY(10px);}
      to{opacity:1; transform:translateY(0);}
    }
    @keyframes bounce {
      0%,80%,100%{ transform:scale(0); }
      40%{ transform:scale(1); }
    }
    @media (max-width:768px){
      .chat-container {
        height: calc(100vh - 220px);
        padding:1rem;
      }
      .message { max-width:90%; }
      .controls { flex-direction:column; gap:0.5rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container">
      <div class="header-title">
        <i class="bi bi-robot"></i>
        <span>RAG 智能检索助手</span>
      </div>
    </div>
  </div>

  <div class="chat-container" id="chatHistory">
    <div class="empty-state">
      <i class="bi bi-chat-dots" style="font-size:40px;"></i>
      <p class="mt-3">输入你的问题，我会从知识库中检索并渲染 MD 格式结果。</p>
    </div>
  </div>

  <div class="input-container">
    <div class="input-card">
      <form id="queryForm" class="form-row">
        <textarea id="queryInput" class="query-input" placeholder="请输入你的问题..." required></textarea>
        <button type="submit" id="submitBtn" class="submit-btn">
          <i class="bi bi-send"></i>
        </button>
      </form>
      <div class="controls">
        <div>
          知识库：
          <select id="collectionSelect" class="border rounded px-2 py-1">
            <option value="daily_health_consult">日常健康咨询</option>
            <option value="warning_explain">报警说明</option>
            <option value="machine_maintenance">机器保养</option>
            <option value="breath_report_explain">呼吸报告说明</option>
            <option value="first_use_guidance">初次使用指导</option>
            <option value="daily_use_guidance">日常使用指导</option>
            <option value="voice_encourage_info">语音鼓励信息</option>
          </select>
        </div>
        <div>
          返回数量：
          <select id="topKSelect" class="border rounded px-2 py-1">
            <option value="1">1条</option>
            <option value="3" selected>3条</option>
            <option value="5">5条</option>
            <option value="10">10条</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入解析 & 高亮库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    marked.setOptions({
      highlight: (code, lang) => {
        if (typeof hljs !== "undefined" && lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, {language: lang}).value;
        } else if (typeof hljs !== "undefined") {
          return hljs.highlightAuto(code).value;
        }
        return code;
      },
      breaks: true,
      gfm: true
    });

    document.addEventListener('DOMContentLoaded', () => {
      const chatHistory = document.getElementById('chatHistory');
      const emptyState = document.querySelector('.empty-state');
      const queryForm = document.getElementById('queryForm');
      const queryInput = document.getElementById('queryInput');
      const submitBtn = document.getElementById('submitBtn');
      const topKSelect = document.getElementById('topKSelect');
      const collectionSelect = document.getElementById('collectionSelect');

      queryInput.addEventListener('input', function(){
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });

      queryForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const queryText = queryInput.value.trim();
        const topK = parseInt(topKSelect.value);
        const kbName = collectionSelect.value;

        if (!queryText) return;
        queryInput.value = '';
        queryInput.style.height = '56px';

        if (emptyState) emptyState.style.display = 'none';
        addMessageToHistory('user', queryText);

        submitBtn.disabled = true;
        const loadingId = addLoadingToHistory();

        try {
          const response = await fetch('http://localhost:8000/retrieval/query_by_name', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              query_text: queryText,
              kb_name: kbName,
              top_k: topK
            })
          });
          const data = await response.json();
          removeLoadingFromHistory(loadingId);

          if (response.ok && data.status === 'success') {
            const results = data.data || [];
            let assistantContent = '';

            if (results.length === 0) {
              assistantContent = '<p>未检索到相关文档，请尝试调整关键词。</p>';
            } else {
              results.forEach((item, idx) => {
                const mdHtml = marked.parse ? marked.parse(item.content) : marked(item.content);
                assistantContent += `
                  <div class="md-result-item">
                    <p><strong>相关结果 ${idx + 1}：</strong></p>
                    ${mdHtml}
                    <span class="source-tag">来源：${item.source || '未知'} | 相似度：${item.similarity_score.toFixed(4)}</span>
                  </div>
                `;
              });
            }
            addMessageToHistory('assistant', assistantContent);
            if (typeof hljs !== "undefined" && typeof hljs.highlightAll === "function") {
              hljs.highlightAll();
            }
          } else {
            throw new Error(data.message || '检索失败');
          }
        } catch (err) {
          console.error("请求出错：", err);
          removeLoadingFromHistory(loadingId);
          addMessageToHistory('assistant', `<p class="error-message">❌ 错误：${err.message}</p>`);
        } finally {
          submitBtn.disabled = false;
          scrollToBottom();
        }
      });

      function addMessageToHistory(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;
        const avatarHtml = role === 'user'
          ? `<div class="message-avatar user-avatar"><i class="bi bi-person"></i></div>`
          : `<div class="message-avatar assistant-avatar"><i class="bi bi-robot"></i></div>`;
        const contentHtml = `<div class="message-content ${role==='user'?'user-content':'assistant-content'}">${content}</div>`;
        msgDiv.innerHTML = avatarHtml + contentHtml;
        chatHistory.appendChild(msgDiv);
        scrollToBottom();
        return msgDiv;
      }

      function addLoadingToHistory() {
        const ld = addMessageToHistory('assistant', `<div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>`);
        const lid = `loading-${Date.now()}`;
        ld.id = lid;
        return lid;
      }

      function removeLoadingFromHistory(lid) {
        const el = document.getElementById(lid);
        if (el) el.remove();
      }

      function scrollToBottom() {
        chatHistory.scrollTo({top: chatHistory.scrollHeight, behavior:'smooth'});
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
